{% extends "base.html" %}
{% load static %}
{% block title %} 404 {% endblock %}
{% block content %}
    <style>
        <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .body {
            background-color: #0b0f19;
            color: #f3f4f6;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .wrapper {
            text-align: center;
            padding: 40px;
        }
        .glow-title {
            font-size: 10rem;
            font-weight: 800;
            color: #00f2fe;
            text-shadow: 0 0 20px rgba(0, 242, 254, 0.6);
            line-height: 1;
        }
        h2 {
            font-size: 1.75rem;
            margin-top: 20px;
            letter-spacing: 1px;
        }
        p {
            color: #9ca3af;
            margin: 15px 0 35px 0;
            font-size: 1rem;
        }
        .home-link {
            text-decoration: none;
            color: #0b0f19;
            background: #00f2fe;
            padding: 14px 28px;
            border-radius: 50px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(0, 242, 254, 0.4);
            transition: all 0.3s ease;
        }
        .home-link:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 242, 254, 0.6);
        }
        .glow-title::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #00f2fe, #ff00c8, #00f2fe);
            filter: blur(20px);
            opacity: 0.7;
            z-index: -1;
        }
        .glow-title::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #00f2fe, #ff00c8, #00f2fe);
            filter: blur(40px);
            opacity: 0.5;
            z-index: -1;
        }
        .glow-title:hover::after,
        .glow-title:hover::before {
            blur: 60px;
            opacity: 1;
            translate: 0 5px;

        }
    </style>
    </style>
    <div class="body">
    <div class="wrapper">
        <div class="glow-title">404</div>
        <h2>LOST IN THE VOID</h2>
        <p>The page you are looking for has drifted out into deep space.</p>
        <a href="/" class="home-link">Return to Home</a>
    </div>
    </div>
{% endblock content %}

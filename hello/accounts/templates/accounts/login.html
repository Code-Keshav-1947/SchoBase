<!doctype html>
<html lang="en" data-bs-theme='dark'>
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.rtl.min.css" integrity="sha384-CfCrinSRH2IR6a4e6fy2q6ioOX7O6Mtm1L9vRvFZ1trBncWmMePhzvafv7oIcWiW" crossorigin="anonymous">

    <title>login</title>
  </head>
  <body>
    <!-- Login Page Box Container (Form ko beech mein laane ke liye) -->
<div class="container d-flex justify-content-center align-items-center min-vh-100">
  
  <!-- data-bs-theme="dark" se poora box dark mode mein chalega -->
  <div class="card shadow p-4" style="width: 100%; max-width: 400px;" >
    <div class="card-body">
     <!-- templates/registration/login.html -->
<!-- login.html -->
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card p-4 shadow-sm" style="width: 100%; max-width: 400px; border-radius: 10px;">
        
        <h3 class="text-center mb-4 fw-bold text-primary">Sign In</h3>

        <!-- Agar username ya password galat ho to yeh Bootstrap Alert dikhega -->
        {% if form.errors %}
            <div class="alert alert-danger alert-dismissible fade show" role="alert">
                <strong>Wrong!</strong> Username or Password is incorrect.
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endif %}

        <form method="post" novalidate>
            {% csrf_token %}

            <!-- Username Field -->
            <div class="mb-3">
                <label for="{{ form.username.id_for_label }}" class="form-label fw-semibold">Username</label>
                {{ form.username }}
                {% if form.username.errors %}
                    <div class="text-danger small mt-1">{{ form.username.errors|striptags }}</div>
                {% endif %}
            </div>

            <!-- Password Field -->
            <div class="mb-4">
                <label for="{{ form.password.id_for_label }}" class="form-label fw-semibold">Password</label>
                {{ form.password }}
                {% if form.password.errors %}
                    <div class="text-danger small mt-1">{{ form.password.errors|striptags }}</div>
                {% endif %}
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
                Log In
            </button>
        </form>

    </div>
</div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11">
      Swal.mixin({
        toast: true,
        position: "top-end",
        showConfirmButton: false,
        timer: 3000,
        timerProgressBar: true,
        didOpen: (toast) => {
            toast.onmouseenter = Swal.stopTimer;
            toast.onmouseleave = Swal.resumeTimer;
        }
    }).fire({
    icon: "success",
    title: "Signed in successfully"
});
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

  </body>
</html>

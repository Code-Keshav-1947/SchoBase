{% extends "base.html" %}
{% load static %}
{% block title %}
{{ request.user.username }}-Dashboard
{% endblock %}

{% block content %}
<!-- 1. पैरेंट कंटेनर: जो इमेज और टेक्स्ट को एक साथ बांध कर रखेगा -->
<div class="position-relative w-100 mx-auto" style="max-width: 100%;">
    
    <!-- 2. आपकी बैकग्राउंड इमेज -->
    <img class="img-fluid rounded mx-auto d-block w-100" src="{% static 'img/dash_hero.jpg' %}" alt="Dashboard Hero">
    
    <!-- 3. आपका वेलकम टेक्स्ट (जो बिना किसी गड़बड़ के अब 25% ऊंचाई पर सेट रहेगा) -->
    <div class="position-absolute start-50 translate-middle text-center w-100 px-3" style="top: 25%;">
        <!-- text-dark और वाइट शैडो के साथ रिस्पॉन्सिव फॉन्ट साइज -->
        <h1 class="card-title display-4 text-dark text-capitalize fw-bold" style="text-shadow: 0px 0px 10px rgba(255, 255, 255, 0.9), 2px 2px 4px rgba(255, 255, 255, 0.8); font-size: calc(1.5rem + 3vw);">
            Hello! {{ request.user.username }}
        </h1>
    </div>

</div>
{% endblock %}

{% extends "base.html" %}
{% load static %} 
{% block title %} 
{{ request.user.username }}-Dashboard
{% endblock %} 
{% block content %}

<!-- Hero Section -->
<div class="position-relative w-100 mx-auto mb-5" style="max-width: 100%">
  <img
    class="img-fluid rounded mx-auto d-block w-100"
    src="{% static 'img/dash_hero.png' %}"
    alt="Dashboard Hero"
  />
  <div
    class="position-absolute start-50 translate-middle text-center w-100 px-3"
    style="top: 25%"
  >
    <h1
      class="card-title display-4 text-dark text-capitalize fw-bold"
      style="
        text-shadow:
          0px 0px 10px rgba(255, 255, 255, 0.9),
          2px 2px 4px rgba(255, 255, 255, 0.8);
        font-size: calc(1.5rem + 3vw);
      "
    >
      Hello! {{ request.user.username }}
    </h1>
  </div>
</div>
{% endblock %}

{% extends "base.html" %}
{% load static %} 
{% block title %} 
{{ user_name|title }}-Dashboard
{% endblock %} 
{% block content %}

<!-- Hero Section -->
<div class="position-relative w-100 mx-auto mb-5" style="max-width: 100%">
  <img
    class="img-fluid rounded mx-auto d-block w-100"
    src="{% static 'img/dash_hero.png' %}"
    alt="Dashboard Hero" draggable="false"
  />
  <div
    class="position-absolute start-50 translate-middle text-center w-100 px-3"
    style="top: 25%"
  >
    <h1
      class="card-title display-4  text-capitalize dash-n"
    >
      Hello! {{ user_name|title  }}.
    </h1>
  </div>
</div>
{% block extra %}{% endblock extra %}
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
{% if messages %}
    <script>
        {% for message in messages %}
            {% if message.tags == 'success' %}
                Swal.fire({
                    title: "Success!",
                    text: "{{ message }}",
                    icon: "success",
                    draggable: true,
                    theme: "dark",
                });
            {% endif %}
        {% endfor %}
    </script>
{% endif %}
{% endblock %}

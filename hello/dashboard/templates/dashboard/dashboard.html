{% extends "base.html" %}
{% load static %} 
{% block title %} 
{{ request.user.username }}-Dashboard
{% endblock %} 
{% block content %}

<!-- Hero Section -->
<div class="position-relative w-100 mx-auto mb-5" style="max-width: 100%">
  <img
    class="img-fluid rounded mx-auto d-block w-100"
    src="{% static 'img/dash_hero.png' %}"
    alt="Dashboard Hero"
  />
  <div
    class="position-absolute start-50 translate-middle text-center w-100 px-3"
    style="top: 25%"
  >
    <h1
      class="card-title display-4  text-capitalize "
      style="
      color: transparent;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
      background: linear-gradient(to right, red,blue);
      -webkit-background-clip: text;
      font-weight: 500;
      text-shadow: 0 0 16px rgb(186 57 57 / 78%);
      animation: glower 1s ease-in-out infinite alternate;
      "
    >
      Hello! {{ request.user.username }}
    </h1>
  </div>
</div>
{% block extra %}{% endblock extra %}
{% endblock %}

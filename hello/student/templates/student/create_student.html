{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h1 class="text-center mb-4">Add New Student</h1>
    
    <!-- IMPORTANT: enctype="multipart/form-data" is REQUIRED to upload the profile_pic file -->
    <form method="POST" enctype="multipart/form-data" class="needs-validation">
        {% csrf_token %}
        
        <!-- This loop outputs all fields, including your ForeignKey dropdowns -->
        {% for field in form %}
            <div class="mb-3">
                <label class="form-label">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <div class="text-danger small">{{ field.errors }}</div>
                {% endif %}
            </div>
        {% endfor %}
        
        <button type="submit" class="btn btn-primary">Save Student</button>
        <a href="{% url 'student:student_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock content %}

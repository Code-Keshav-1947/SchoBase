{% extends "base.html" %}

{% block content %}
<div class="container my-5" style="max-width: 600px;">
    <h1 class="text-center mb-4">Update Student</h1>
    
    <form method="post" class="card p-4 shadow-sm">
        {% csrf_token %}
        
        <div class="form-group mb-3">
            <label for="first_name" class="form-label">First Name</label>
            <input type="text" class="form-control" id="first_name" name="first_name" value="{{ student.first_name }}" required>
        </div>
        
        <div class="form-group mb-3">
            <label for="last_name" class="form-label">Last Name</label>
            <input type="text" class="form-control" id="last_name" name="last_name" value="{{ student.last_name }}" required>
        </div>
        
        <div class="form-group mb-3">
            <label for="admission_no" class="form-label">Admission No</label>
            <input type="text" class="form-control" id="admission_no" name="admission_no" value="{{ student.admission_no }}" required>
        </div>
        
        <div class="form-group mb-4">
            <label for="roll_no" class="form-label">Roll No</label>
            <input type="number" class="form-control" id="roll_no" name="roll_no" value="{{ student.roll_no }}" required>
        </div>
        
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary w-100">Update Student</button>
            <a href="{% url 'student:student_list' %}" class="btn btn-outline-secondary w-100">Cancel</a>
        </div>
    </form>
</div>
{% endblock content %}

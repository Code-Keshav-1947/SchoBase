{% extends "base.html" %}

{% block title %}Take Attendance{% endblock %}

{% block content %}
    <h1>Take Attendance</h1>
    <form method="post">
        {% csrf_token %}
        <table>
            <tr>
                <th>Student Name</th>
                <th>Present</th>
            </tr>
            {% for student in students %}
            <tr>
                <td>{{ student.first_name }}</td>
                <td><input type="checkbox" name="attendance_{{ student.id }}"></td>
            </tr>
            {% endfor %}
        </table>
        <button type="submit">Submit Attendance</button>
    </form>
{% endblock %}
